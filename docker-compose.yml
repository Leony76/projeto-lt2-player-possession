
services:
  db:
    image: postgres:17-alpine
    container_name: lumber-tycoon-2-players-possession-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-init:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: lumber-tycoon-2-players-possession-init
    restart: "no"

    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules

    command:
      - sh
      - -c
      - |
        cd backend &&
        npx prisma generate &&
        npx prisma migrate deploy &&
        npx prisma db seed

    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: lumber-tycoon-2-players-possession-backend
    restart: unless-stopped

    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}

    ports:
      - "3000:3000"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/backend/node_modules

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: lumber-tycoon-2-players-possession-frontend
    restart: unless-stopped

    environment:
      NODE_ENV: development

    ports:
      - "5173:5173"

    volumes:
      - .:/app
      - /app/node_modules
      - /app/frontend/node_modules

    depends_on:
      - backend

volumes:
  postgres_data:
